[deploy]
# The hosted API currently serves the built web shell. Railway injects PORT.
# Keep the Python module paths explicit because this is a monorepo.
startCommand = "sh -c 'PYTHONPATH=spatialguard/services/api:services/api:packages/sdk-python python -m uvicorn spatialguard_api.api:create_app --factory --host 0.0.0.0 --port ${PORT:-8010}'"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
