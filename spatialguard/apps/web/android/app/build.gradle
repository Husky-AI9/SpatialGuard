apply plugin: 'com.android.application'

android {
    buildFeatures { buildConfig true }
    def hostedApiUrl = (project.findProperty('SPATIALGUARD_API_URL') ?: System.getenv('SPATIALGUARD_API_URL') ?: 'https://spatialguard-production.up.railway.app')
        .toString().replace('\\', '\\\\').replace('"', '\\"')
    // Debug installs use the hosted service by default so emulator sign-in
    // behaves like the submitted app. Local API testing remains available by
    // passing -PSPATIALGUARD_DEBUG_API_URL=http://127.0.0.1:8010 explicitly.
    def debugApiUrl = (project.findProperty('SPATIALGUARD_DEBUG_API_URL') ?: System.getenv('SPATIALGUARD_DEBUG_API_URL') ?: hostedApiUrl)
        .toString().replace('\\', '\\\\').replace('"', '\\"')
    def releaseKeystore = System.getenv('SPATIALGUARD_ANDROID_KEYSTORE')
    def releaseStorePassword = System.getenv('SPATIALGUARD_ANDROID_KEYSTORE_PASSWORD')
    def releaseKeyAlias = System.getenv('SPATIALGUARD_ANDROID_KEY_ALIAS')
    def releaseKeyPassword = System.getenv('SPATIALGUARD_ANDROID_KEY_PASSWORD')
    namespace = "dev.spatialguard.preview"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.spatialguard.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "0.2.0"
        buildConfigField "String", "SPATIALGUARD_API_URL", '""'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseKeystore && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
            release {
                storeFile file(releaseKeystore)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }
    buildTypes {
        debug {
            buildConfigField "String", "SPATIALGUARD_API_URL", "\"${debugApiUrl}\""
        }
        release {
            buildConfigField "String", "SPATIALGUARD_API_URL", "\"${hostedApiUrl}\""
            minifyEnabled false
            if (signingConfigs.findByName('release') != null) signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
