[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "twinforge"
version = "0.1.0"
description = "A revisioned, provider-independent spatial twin engine"
requires-python = ">=3.11"
dependencies = ["fastapi==0.141.1", "starlette==1.3.1", "uvicorn==0.34.0", "pydantic==2.10.6", "numpy==2.2.2", "shapely==2.0.7", "pillow==12.3.0", "opencv-python-headless==5.0.0.93", "tzdata==2026.4"]

[project.optional-dependencies]
dev = ["pytest==9.0.3", "httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["services/api", "packages/sdk-python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["services/api", "packages/sdk-python"]
